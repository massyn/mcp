<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Citadel{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <style>
        .sidebar {
            height: calc(100vh - 56px);
            overflow-y: auto;
            position: sticky;
            top: 56px;
        }
        .room-link { border-radius: 4px; transition: background .1s; }
        .room-link.active { background-color: var(--bs-primary-bg-subtle); font-weight: 500; }
        #main-content { min-height: calc(100vh - 56px); }
        .prose img { max-width: 100%; }
        .prose pre { background: #f8f9fa; padding: 1rem; border-radius: .25rem; overflow-x: auto; }
        .prose code:not(pre code) { background: #f1f3f5; padding: .1em .35em; border-radius: .2em; font-size: .9em; }
        .prose blockquote { border-left: 3px solid #dee2e6; padding-left: 1rem; color: #6c757d; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .prose th, .prose td { border: 1px solid #dee2e6; padding: .4rem .6rem; }
        .prose th { background: #f8f9fa; }
        .priority-1 { border-left: 3px solid #dc3545; }
        .priority-2 { border-left: 3px solid #fd7e14; }
        .priority-3 { border-left: 3px solid #6c757d; }
        .priority-4 { border-left: 3px solid #198754; }
        .priority-5 { border-left: 3px solid #adb5bd; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid gap-2">
            <a class="navbar-brand me-2 flex-shrink-0" href="/">Citadel</a>
            <div class="flex-grow-1">
                <input class="form-control form-control-sm"
                       type="search"
                       name="q"
                       placeholder="Search entries..."
                       hx-get="/search"
                       hx-target="#main-content"
                       hx-trigger="input changed delay:400ms, search"
                       autocomplete="off">
            </div>
            <a class="btn btn-outline-light btn-sm flex-shrink-0" href="/">Entries</a>
            <a class="btn btn-outline-light btn-sm flex-shrink-0" href="/todos">Todos</a>
            <a class="btn btn-outline-light btn-sm flex-shrink-0" href="/velocity">Velocity</a>
        </div>
    </nav>

    <div class="container-fluid p-0">
        <div class="row g-0">
            {% if self.sidebar() | trim %}
            <div class="col-md-3 col-xl-2 sidebar border-end bg-light px-2 py-3 d-none d-md-block">
                {% block sidebar %}{% endblock %}
            </div>
            <div class="col-md-9 col-xl-10 p-3">
            {% else %}
            <div class="col p-3">
            {% endif %}
                <div id="main-content">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function renderMarkdown() {
            const el = document.getElementById('entry-detail-md');
            if (el && typeof marked !== 'undefined') {
                el.innerHTML = marked.parse(el.dataset.md || '');
            }
        }

        function highlightRoom() {
            const path = window.location.pathname;
            document.querySelectorAll('.room-link').forEach(function (a) {
                a.classList.toggle('active', path.startsWith(a.getAttribute('href')));
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderMarkdown();
            highlightRoom();
        });

        document.body.addEventListener('htmx:afterSettle', function () {
            renderMarkdown();
            highlightRoom();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
